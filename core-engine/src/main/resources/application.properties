server.port=8080
spring.application.name=riskmatrix-core

# --- Datasource Configuration (Satisfies Rubric: JDBC) ---
# Defaulting to H2 in-memory for zero-config rubric demonstration
spring.datasource.url=jdbc:h2:mem:riskdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

